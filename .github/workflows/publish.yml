name: Publish @battlegrid/mcp-server

on:
  push:
    tags:
      - 'mcp-server@*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Enforce one immutable release identity: the Git tag, package.json,
      # package-lock.json, and the source MCP handshake VERSION must all agree
      # before anything is packed or published.
      - name: Verify version integrity (tag == package.json == package-lock == src VERSION)
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#mcp-server@}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          SRC_VERSION="$(node -p "require('fs').readFileSync('src/index.ts','utf8').match(/VERSION = '([^']+)'/)[1]")"
          echo "tag=$TAG_VERSION package.json=$PKG_VERSION package-lock.json=$LOCK_VERSION src=$SRC_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$PKG_VERSION" != "$LOCK_VERSION" ] || [ "$PKG_VERSION" != "$SRC_VERSION" ]; then
            echo "::error::Version mismatch — the Git tag, package.json, package-lock.json, and src VERSION must all match before publish."
            exit 1
          fi
          echo "Version integrity OK: $PKG_VERSION"

      # Tests must pass before we pack or publish.
      - run: npm test

      - run: npm run build

      - run: npm pack --dry-run

      - run: npm publish --access public --provenance
